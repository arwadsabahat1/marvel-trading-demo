[project]
name = "marvel-trading-demo"
version = "0.6.0"
description = "An educational Bitcoin research, risk-control and paper-trading demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.marvel]
execution = "offline paper, prospective paper, Testnet and evidence-gated Spot operations"
