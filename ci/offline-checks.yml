name: Offline demo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public files
        run: python scripts/check_publish.py
      - name: Test without network access or credentials
        run: python scripts/check_demo.py
      - name: Build the source-only demo archive
        run: python scripts/package_demo.py
